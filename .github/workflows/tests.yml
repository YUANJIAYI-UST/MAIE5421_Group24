name: Python checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install torch==2.7.1+cpu --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python scripts/make_smoke_data.py
      - run: python -m transparent_seg.train --config configs/smoke.json --output runs/ci
      - run: python -m transparent_seg.evaluate --checkpoint runs/ci/best.pt --manifest manifests/smoke/test.json --output runs/ci/evaluation --device cpu
