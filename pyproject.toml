[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maie5421-transparent-seg"
version = "0.1.0"
description = "Group 24: boundary-aware transparent object segmentation research starter"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["transparent_seg*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
